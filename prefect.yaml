name: revoletion
prefect-version: "3.7.4"

deployments:
  - name: revoletion
    entrypoint: revoletion.flows:scenario_run_flow
    build: null
    schedules: []
    pull:
      # Module-notation entrypoint uses Python's import system, so /app must be on
      # sys.path for `import revoletion` to resolve the local source copy at
      # /app/revoletion/ (needed for the __file__-based example path in flows.py).
      - prefect.deployments.steps.set_working_directory:
          directory: /app
    work_pool:
      name: docker
      job_variables:
        image: revoletion:local
        networks:
          - "revoletion_default"
        env:
          PREFECT_API_URL: "http://prefect-server:4200/api"
