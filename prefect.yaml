# This file is required for prefect orchestration. It tells the prefect-worker container
# how to spin up a revol-e-tion container for running a scenario.
---
name: revoletion
prefect-version: "3.7.4"

deployments:
  - name: revoletion
    entrypoint: revoletion.flows:scenario_run_flow
    build: null
    schedules: []
    pull:
      # Module-notation entrypoint uses Python's import system, so /app must be on
      # sys.path for `import revoletion` to resolve the local source copy at
      # /app/revoletion/ (needed for the __file__-based example path in flows.py).
      - prefect.deployments.steps.set_working_directory:
          directory: /app
    work_pool:
      name: docker
      job_variables:
        image: revoletion:local
        networks:
          - "revoletion_default"
        env:
          PREFECT_API_URL: "http://prefect-server:4200/api"
          WLSACCESSID: "321d9ddc-3e5c-448c-b325-d4d9a5e9c6fe"
          WLSSECRET: "a0c7e27c-6d02-4fbb-9e17-44c7ff33d2cf"
          LICENSEID: "2835065"
