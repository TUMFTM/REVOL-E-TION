[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revoletion"
version = "1.5.1"
description = "Resilient Electric Vehicle Optimization model for Local Energy TransitION"
authors = [
    { name = "Philipp Rosner", email = "philipp.rosner@tum.de" },
    { name = "Brian Dietermann", email = "brian.dietermann@tum.de"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopy",
    "holidays",
    "numpy",
    "numpy_financial",
    "oemof.solph==0.6.0a3",
    "pandas>=2.1",
    "plotly",
    "psutil",
    "pvlib>=0.13.0",
    "pytz",
    "rainflow",
    "scipy",
    "simpy",
    "timezonefinder",
    "tk",
    "windpowerlib"
]

[dependency-groups]
dev = ["pre-commit"]

[tool.setuptools]
packages = ["revoletion"]

[tool.setuptools.package-data]
revoletion = ["data/*", "example/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Enable import sorting.
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Ignore unused imports in __init__.py files.
"__init__.py" = ["E402", "F401"]

[project.scripts]
revoletion = "revoletion.__main__:main"
