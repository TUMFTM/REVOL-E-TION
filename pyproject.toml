[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revoletion"
version = "1.4.0"
description = "Resilient Electric Vehicle Optimization model for Local Energy TransitION"
authors = [
    { name = "Philipp Rosner", email = "philipp.rosner@tum.de" },
    { name = "Brian Dietermann", email = "brian.dietermann@tum.de"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "demandlib",
    "geopandas",
    "geopy",
    "holidays",
    "numpy",
    "numpy_financial",
    "oemof.solph==0.6.0a3",
    "pandas>=2.1",
    "plotly",
    "psutil",
    "pvlib>=0.13.0",
    "pytz",
    "rainflow",
    "scipy",
    "simpy",
    "tespy",
    "timezonefinder",
    "tk",
    "windpowerlib"
]

[tool.setuptools]
packages = ["revoletion"]

[tool.setuptools.package-data]
revoletion = ["data/*", "example/*"]

[project.scripts]
revoletion = "revoletion.main:main"
