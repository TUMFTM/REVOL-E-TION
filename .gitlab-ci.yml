stages:
  - style
  - testing

variables:
  UV_VERSION: 0.8
  PYTHON_VERSION: 3.11
  BASE_LAYER: bookworm-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache
  UV_INDEX_INTERNAL_USERNAME: gitlab-ci-token

default:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  before_script: &default_before_script
    - apt-get update
    - apt-get install -y --no-install-recommends git coinor-cbc
    - export UV_INDEX_INTERNAL_PASSWORD="$CI_JOB_TOKEN"
  cache:
    paths:
      - $UV_CACHE_DIR

main_testing:
  stage: testing
  before_script:
    - *default_before_script
    - uv sync --group tests
  script:
    - uv run coverage run -m pytest tests/
    - uv run coverage report -m || true
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

pre_commit:
  stage: style
  variables:
  before_script:
    - *default_before_script
    - uv sync --group dev
  script:
    - uv run --no-sync pre-commit run --all-files --show-diff-on-failure
    - uv cache prune --ci
